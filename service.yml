name: laravel-php
type: service
from: php
guidance: GUIDANCE.md
fromVersionConstraint: "^3.0.0"
fromVersion: "3.4.6"
title: PHP (Laravel)

links:
# Laravel's MySQL and MariaDB connections read the CA certificate path from MYSQL_ATTR_SSL_CA and connect with TLS
# when it is set.
- name: db
  env:
  - name: MYSQL_ATTR_SSL_CA
    value: '{{link.database.caFile}}'
- name: storage
  title: Storage
  required: true
  selectors:
  - type: storage
- name: redis
  title: Redis
  env:
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  # The name of Laravel's Redis queue connection, not the server's address.
  - name: QUEUE_CONNECTION
    value: redis
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

volumes:
- name: storage
  title: Storage
  link: storage
  shared: true
  size: 10
  path: /mnt/files
  import:
    owner: 82
    group: 82


labels:
- laravel

options:
- version: '8.4'
  default: true
  tag: 8.4-r20
  digest: sha256:bf88e861ba0d2315bea4b2f318620889a66f583d6b3ecdbfe7c9ed912bfa1ab2
  devTag: 8.4-dev-r20
  devDigest: sha256:46763fa3f5bf1445715966faef06eb48fb63f167f07a9dc3e45e60992da3a191
- version: '8.5'
  tag: 8.5-r20
  digest: sha256:c18d1e5dbe02a30fdce41d7841806865bc40508c8766f2887cfedfb4ab94f928
  devTag: 8.5-dev-r20
  devDigest: sha256:15e0c49f4aed07513bbffea4c8a9627a763a3ee58bf0f95b05ead1c6c20655f1
- version: '8.3'
  tag: 8.3-r20
  digest: sha256:b7f9a4f7d17228816ea14eebc9bbd40d55ae89bd237ea1f864e65b76684a9088
  devTag: 8.3-dev-r20
  devDigest: sha256:799853aa47f5cfd7bd659d9e56a12044ca3151adafb2a0622f7fbd8e2b90efb4
- version: '8.2'
  tag: 8.2-r20
  digest: sha256:da467a472e8e420b52c08c57618a9078ce22be0f98156295edab763efc291774
  devTag: 8.2-dev-r20
  devDigest: sha256:b2f796c49858494a2abe3322e23b3b00eaa9abe28e2dc6404348fdf067f02cab
env:
- name: APP_KEY
  value: '{{app_key}}'
  secret: true
# The name the image writes to the generated .env.
- name: APP_DEBUG
  value: 'true'
  envType: dev
- name: WODBY2_SERVICE_INIT_ACTION
  value: init-laravel

cron:
- name: scheduler
  title: Task Scheduler
  command: cd "${APP_ROOT}" && php artisan schedule:run
  # A service schedule can run at most once an hour. Laravel's scheduler then
  # runs the tasks due at that minute.
  schedule: 0 * * * *

derivatives:
- name: laravel-php-queue
  icon: laravel
  title: Laravel Queue
  args: ['php', 'artisan', 'queue:listen']
  type: service
  default: true
  required: false

build:
  connect: true
  boilerplates:
  - name: boilerplate
    title: Laravel on Wodby
    repo: https://github.com/wodby/laravel-boilerplate
    branch: main
    optionVersionConstraint: "^8.3"

tokens:
- name: app_key
  generate:
    regex: '[0-9a-z]{32}'

actions:
- name: database_migrate
  title: Run migrate
  args:
  - php
  - artisan
  - migrate
  # Never waits for a confirmation, whatever the application environment.
  - --force
  type: post_deploy
- name: database_seed
  title: Seed database
  depends:
  - database_migrate
  args:
  - php
  - artisan
  - db:seed
  type: post_deploy_once

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: php
    image: wodby/laravel-php
    build: true

# Parent upgrades must not enable unvalidated workspace behavior.
workspace: false
