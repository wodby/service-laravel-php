name: laravel-php
type: service
from: php
guidance: GUIDANCE.md
fromVersionConstraint: "^3.0.0"
fromVersion: "3.0.1"
title: PHP (Laravel)

links:
- name: storage
  title: Storage
  required: true
  selectors:
  - type: storage
- name: redis
  title: Redis
  env:
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  # The name of Laravel's Redis queue connection, not the server's address.
  - name: QUEUE_CONNECTION
    value: redis
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

volumes:
- name: storage
  title: Storage
  link: storage
  shared: true
  size: 10
  path: /mnt/files
  import:
    owner: 82
    group: 82


labels:
- laravel

options:
- version: '8.4'
  default: true
  tag: 8.4-r9
  devTag: 8.4-dev-r9
- version: '8.5'
  tag: 8.5-r9
  devTag: 8.5-dev-r9
- version: '8.3'
  tag: 8.3-r9
  devTag: 8.3-dev-r9
- version: '8.2'
  tag: 8.2-r9
  devTag: 8.2-dev-r9
env:
- name: APP_KEY
  value: '{{app_key}}'
  secret: true
# The name the image writes to the generated .env.
- name: APP_DEBUG
  value: 'true'
  envType: dev
- name: WODBY2_SERVICE_INIT_ACTION
  value: init-laravel

cron:
- name: scheduler
  title: Task Scheduler
  command: cd "${APP_ROOT}" && php artisan schedule:run
  # Laravel's scheduler decides each minute which tasks are due.
  schedule: '* * * * *'

derivatives:
- name: laravel-php-queue
  icon: laravel
  title: Laravel Queue
  args: ['php', 'artisan', 'queue:listen']
  type: service
  default: true
  required: false

build:
  connect: true
  boilerplates:
  - name: boilerplate
    title: Laravel on Wodby
    repo: https://github.com/wodby/laravel-boilerplate
    branch: main
    optionVersionConstraint: "^8.3"

tokens:
- name: app_key
  generate:
    regex: '[0-9a-z]{32}'

actions:
- name: database_migrate
  title: Run migrate
  args:
  - php
  - artisan
  - migrate
  # Never waits for a confirmation, whatever the application environment.
  - --force
  type: post_deploy
- name: database_seed
  title: Seed database
  depends:
  - database_migrate
  args:
  - php
  - artisan
  - db:seed
  type: post_deploy_once

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: php
    image: wodby/laravel-php
    build: true

# Parent upgrades must not enable unvalidated workspace behavior.
workspace: false
