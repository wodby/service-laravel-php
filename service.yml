name: laravel-php
type: service
from: php
guidance: GUIDANCE.md
fromVersionConstraint: "^3.0.0"
fromVersion: "3.4.5"
title: PHP (Laravel)

links:
# Laravel's MySQL and MariaDB connections read the CA certificate path from MYSQL_ATTR_SSL_CA and connect with TLS
# when it is set.
- name: db
  env:
  - name: MYSQL_ATTR_SSL_CA
    value: '{{link.database.caFile}}'
- name: storage
  title: Storage
  required: true
  selectors:
  - type: storage
- name: redis
  title: Redis
  env:
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  # The name of Laravel's Redis queue connection, not the server's address.
  - name: QUEUE_CONNECTION
    value: redis
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

volumes:
- name: storage
  title: Storage
  link: storage
  shared: true
  size: 10
  path: /mnt/files
  import:
    owner: 82
    group: 82


labels:
- laravel

options:
- version: '8.4'
  default: true
  tag: 8.4-r19
  digest: sha256:edde811acb9f3886d0e7cd336e20347eb81ad9445262ea00b19884f70ee8e8b7
  devTag: 8.4-dev-r19
  devDigest: sha256:813731a3e671bb6c5420edb682203483bc087f94d100bd5a4b07447e689f37f5
- version: '8.5'
  tag: 8.5-r19
  digest: sha256:d10ced245d4a0c9fc83f1cd1e5cd05b65878d0cc6edd25a23bcf37d9999bfe6f
  devTag: 8.5-dev-r19
  devDigest: sha256:665aa148e177198b425cd4bd4d2b461bc9b036e14f143cfeeb9d516124dcec1a
- version: '8.3'
  tag: 8.3-r19
  digest: sha256:15b04ae45b05ff956c7f92c56227944a9e4ecc664d6c170b3374d43b183972c0
  devTag: 8.3-dev-r19
  devDigest: sha256:d20d9466f027125150e4593b2f292eda59045cd809c257cb7b7f9b53f6939d07
- version: '8.2'
  tag: 8.2-r19
  digest: sha256:5d59ccd7afc662b0cdcb7a63ffeb1f71f48f1abca4329cab2af309ea2d1f64ec
  devTag: 8.2-dev-r19
  devDigest: sha256:b45a0bafacbf52a613ea3ad2451d207e6838b2ebf759223517fde05fe4b35b26
env:
- name: APP_KEY
  value: '{{app_key}}'
  secret: true
# The name the image writes to the generated .env.
- name: APP_DEBUG
  value: 'true'
  envType: dev
- name: WODBY2_SERVICE_INIT_ACTION
  value: init-laravel

cron:
- name: scheduler
  title: Task Scheduler
  command: cd "${APP_ROOT}" && php artisan schedule:run
  # A service schedule can run at most once an hour. Laravel's scheduler then
  # runs the tasks due at that minute.
  schedule: 0 * * * *

derivatives:
- name: laravel-php-queue
  icon: laravel
  title: Laravel Queue
  args: ['php', 'artisan', 'queue:listen']
  type: service
  default: true
  required: false

build:
  connect: true
  boilerplates:
  - name: boilerplate
    title: Laravel on Wodby
    repo: https://github.com/wodby/laravel-boilerplate
    branch: main
    optionVersionConstraint: "^8.3"

tokens:
- name: app_key
  generate:
    regex: '[0-9a-z]{32}'

actions:
- name: database_migrate
  title: Run migrate
  args:
  - php
  - artisan
  - migrate
  # Never waits for a confirmation, whatever the application environment.
  - --force
  type: post_deploy
- name: database_seed
  title: Seed database
  depends:
  - database_migrate
  args:
  - php
  - artisan
  - db:seed
  type: post_deploy_once

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: php
    image: wodby/laravel-php
    build: true

# Parent upgrades must not enable unvalidated workspace behavior.
workspace: false
