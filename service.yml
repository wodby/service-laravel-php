name: laravel-php
type: service
from: php
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.5"
title: PHP (Laravel)

links:
- name: storage
  title: Storage
  required: true
  selectors:
  - type: storage
- name: redis
  title: Redis
  env:
  - name: QUEUE_CONNECTION
    value: '{{link.host}}'
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

volumes:
- name: storage
  title: Storage
  link: storage
  shared: true
  size: 10
  path: /mnt/files
  import:
    owner: 82
    group: 82


labels:
- laravel

options:
- version: '8.4'
  default: true
  tag: 8.4-0.36.3
- version: '8.5'
  tag: 8.5-0.36.3
- version: '8.3'
  tag: 8.3-0.36.3
- version: '8.2'
  tag: 8.2-0.36.3
env:
- name: APP_KEY
  value: '{{app_key}}'
- name: LARAVEL_APP_DEBUG
  value: 'true'
  envType: dev

cron:
- name: scheduler
  title: Task Scheduler
  command: cd "${APP_ROOT}" && php artisan schedule:run
  schedule: 0 0 * * *

derivatives:
- name: laravel-php-queue
  icon: laravel
  title: Laravel Queue
  args: ['php', 'artisan', 'queue:listen']
  type: service
  default: true
  required: false

build:
  dockerfile: Dockerfile
  connect: true
  boilerplates:
  - name: boilerplate
    title: Laravel on Wodby
    repo: https://github.com/wodby/laravel-boilerplate
    branch: main
    optionVersionConstraint: "^8.3"

tokens:
- name: app_key
  generate:
    regex: '[0-9a-z]{32}'

actions:
- name: database_migrate
  title: Run migrate
  args:
  - php
  - artisan
  - migrate
  type: post_deploy
- name: database_seed
  title: Seed database
  depends:
  - database_migrate
  args:
  - php
  - artisan
  - db:seed
  type: post_deploy_once

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: php
    image: wodby/laravel-php
    build: true
